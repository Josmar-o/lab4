name: Selenium Tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    
    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4
      
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Ejecutar pruebas en modo Headless
        run: |
          pytest test_tienda.py --html=reporte_final.html --self-contained-html
      
      - name: Guardar el Reporte HTML como evidencia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-selenium
          path: reporte_final.html
